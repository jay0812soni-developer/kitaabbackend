<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jeweller details · Kitaab Admin</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="brand">KITAAB Admin</p>
      <h1 id="title">Jeweller</h1>
      <p class="muted" id="meta"></p>
    </div>
    <div class="actions">
      <a class="link" href="./dashboard.html">← Dashboard</a>
      <button type="button" class="ghost" id="logout">Logout</button>
    </div>
  </header>

  <p id="error" class="error" hidden></p>

  <section class="stats" id="stats">
    <div class="stat"><span>Customers</span><strong id="s-customers">—</strong></div>
    <div class="stat"><span>Transactions</span><strong id="s-txns">—</strong></div>
    <div class="stat"><span>Net ₹</span><strong id="s-net">—</strong></div>
  </section>

  <section class="panel">
    <h2>Customers</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Created</th></tr></thead>
        <tbody id="customers"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>Recent transactions</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Type</th>
            <th>Metal</th>
            <th>Fine</th>
            <th>Weight</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="txns"></tbody>
      </table>
    </div>
  </section>

  <script src="./admin.js"></script>
  <script>
    Admin.requireAuth();
    document.getElementById('logout').onclick = () => Admin.logout();

    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = './dashboard.html';

    function fmtDate(v) { return v ? String(v).slice(0, 10) : '—'; }
    function fmt(v, n=2) { return Number(v || 0).toFixed(n); }

    (async () => {
      try {
        const data = await Admin.api('GET', '/api/admin/jewellers/' + id);
        const j = data.jeweller;
        document.getElementById('title').textContent = j.name;
        document.getElementById('meta').textContent =
          `ID ${j.id} · joined ${fmtDate(j.created_at)}` +
          (j.has_security ? ' · security set' : ' · no security') +
          (j.birth_month ? ` · birth month ${j.birth_month}` : '');
        document.getElementById('s-customers').textContent = data.nets.customer_count;
        document.getElementById('s-txns').textContent = data.nets.transaction_count;
        document.getElementById('s-net').textContent = Number(data.nets.amount || 0).toLocaleString('en-IN');

        const cBody = document.getElementById('customers');
        cBody.innerHTML = data.customers.length
          ? data.customers.map((c) =>
              `<tr><td>${Admin.escape(c.name)}</td><td>${fmtDate(c.created_at)}</td></tr>`
            ).join('')
          : '<tr><td colspan="2">No customers</td></tr>';

        const tBody = document.getElementById('txns');
        tBody.innerHTML = data.transactions.length
          ? data.transactions.map((t) =>
              `<tr>
                <td>${fmtDate(t.date)}</td>
                <td>${Admin.escape(t.customer_name || '—')}</td>
                <td class="${t.type}">${t.type}</td>
                <td>${t.category}</td>
                <td>${fmt(t.fine, 3)}</td>
                <td>${fmt(t.weight, 3)}</td>
                <td>₹${fmt(t.amount)}</td>
              </tr>`
            ).join('')
          : '<tr><td colspan="7">No transactions</td></tr>';
      } catch (ex) {
        const err = document.getElementById('error');
        err.textContent = ex.message;
        err.hidden = false;
      }
    })();
  </script>
</body>
</html>
