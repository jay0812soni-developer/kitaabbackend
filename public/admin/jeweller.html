<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jeweller details · Kitaab Admin</title>
  <base href="/admin/" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="brand">KITAAB Admin</p>
      <h1 id="title">Jeweller</h1>
      <p class="muted" id="meta"></p>
    </div>
    <div class="actions">
      <button type="button" class="ghost" id="btnCsv">Export CSV</button>
      <a class="link" href="/admin/dashboard.html">← Dashboard</a>
      <button type="button" class="ghost" id="logout">Logout</button>
    </div>
  </header>

  <p id="error" class="error" hidden></p>

  <section class="stats" id="stats">
    <div class="stat"><span>Customers</span><strong id="s-customers">—</strong></div>
    <div class="stat"><span>Transactions</span><strong id="s-txns">—</strong></div>
    <div class="stat"><span>Net ₹</span><strong id="s-net">—</strong></div>
  </section>

  <section class="panel">
    <div class="row">
      <h2>Customers</h2>
      <input id="custFilter" placeholder="Filter customers" style="max-width:220px" />
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Created</th></tr></thead>
        <tbody id="customers"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="row">
      <h2>Recent transactions</h2>
      <select id="typeFilter">
        <option value="">All types</option>
        <option value="jama">Jama</option>
        <option value="udhar">Udhar</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Type</th>
            <th>Metal</th>
            <th>Fine</th>
            <th>Weight</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="txns"></tbody>
      </table>
    </div>
  </section>

  <script src="/admin/admin.js"></script>
  <script>
    Admin.requireAuth();
    document.getElementById('logout').onclick = () => Admin.logout();

    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = '/admin/dashboard.html';

    let payload = null;

    function fmtDate(v) { return v ? String(v).slice(0, 10) : '—'; }
    function fmt(v, n=2) { return Number(v || 0).toFixed(n); }

    function renderCustomers() {
      const q = document.getElementById('custFilter').value.trim().toLowerCase();
      const list = (payload.customers || []).filter((c) =>
        !q || String(c.name).toLowerCase().includes(q)
      );
      const cBody = document.getElementById('customers');
      cBody.innerHTML = list.length
        ? list.map((c) =>
            `<tr><td>${Admin.escape(c.name)}</td><td>${fmtDate(c.created_at)}</td></tr>`
          ).join('')
        : '<tr><td colspan="2">No customers</td></tr>';
    }

    function renderTxns() {
      const type = document.getElementById('typeFilter').value;
      const list = (payload.transactions || []).filter((t) => !type || t.type === type);
      const tBody = document.getElementById('txns');
      tBody.innerHTML = list.length
        ? list.map((t) =>
            `<tr>
              <td>${fmtDate(t.date)}</td>
              <td>${Admin.escape(t.customer_name || '—')}</td>
              <td class="${t.type}">${t.type}</td>
              <td>${t.category}</td>
              <td>${fmt(t.fine, 3)}</td>
              <td>${fmt(t.weight, 3)}</td>
              <td>₹${fmt(t.amount)}</td>
            </tr>`
          ).join('')
        : '<tr><td colspan="7">No transactions</td></tr>';
    }

    document.getElementById('custFilter').oninput = renderCustomers;
    document.getElementById('typeFilter').onchange = renderTxns;

    document.getElementById('btnCsv').onclick = () => {
      if (!payload) return;
      const header = 'date,customer,type,category,fine,weight,amount';
      const lines = (payload.transactions || []).map((t) =>
        [
          fmtDate(t.date),
          `"${String(t.customer_name || '').replace(/"/g, '""')}"`,
          t.type,
          t.category,
          fmt(t.fine, 3),
          fmt(t.weight, 3),
          fmt(t.amount),
        ].join(',')
      );
      const blob = new Blob([[header, ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `kitaab-jeweller-${id}-txns.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    (async () => {
      try {
        payload = await Admin.api('GET', '/api/admin/jewellers/' + id);
        const j = payload.jeweller;
        document.getElementById('title').textContent = j.name;
        document.getElementById('meta').textContent =
          `ID ${j.id} · joined ${fmtDate(j.created_at)}` +
          (j.has_security ? ' · security set' : ' · no security') +
          (j.birth_month ? ` · birth month ${j.birth_month}` : '');
        document.getElementById('s-customers').textContent = payload.nets.customer_count;
        document.getElementById('s-txns').textContent = payload.nets.transaction_count;
        document.getElementById('s-net').textContent = Number(payload.nets.amount || 0).toLocaleString('en-IN');
        renderCustomers();
        renderTxns();
      } catch (ex) {
        const err = document.getElementById('error');
        err.textContent = ex.message;
        err.hidden = false;
      }
    })();
  </script>
</body>
</html>
